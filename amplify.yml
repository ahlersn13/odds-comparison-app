version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - echo "DATABASE_URL=$DATABASE_URL" >> .env.production
        - echo "POSTGRES_URL=$POSTGRES_URL" >> .env.production
        - echo "ODDS_API_KEY=$ODDS_API_KEY" >> .env.production
        - echo "CRON_SECRET=$CRON_SECRET" >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*